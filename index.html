<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff758c,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:500px;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
text-align:center;
animation:fade 1s;
}

img{
width:200px;
height:200px;
object-fit:cover;
border-radius:50%;
border:5px solid #ff4d6d;
margin-bottom:20px;
}

h1{
color:#ff4d6d;
margin-bottom:10px;
}

#pesan{
margin-top:20px;
text-align:justify;
line-height:1.8;
color:#555;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
background:#ff4d6d;
color:white;
font-size:17px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#ff2f5a;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>
